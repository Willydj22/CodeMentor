<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeMentor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<style>
  :root{
    --bg:#1e1e20; --bg-side:#17171a; --bg-card:#2a2a2e; --bg-input:#2e2e33;
    --border:#38383e; --text:#e9e9ec; --text-dim:#9a9aa2; --accent:#6c8cff;
    --user-bubble:#2e3a66;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; overflow:hidden;
  }
  /* ---------- Sidebar ---------- */
  #sidebar{
    width:260px; min-width:260px; background:var(--bg-side); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:14px 10px; transition:margin-left .2s;
  }
  #sidebar h1{font-size:16px; display:flex; align-items:center; gap:8px; margin:4px 6px 16px; color:var(--text)}
  #sidebar h1 span.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  #nuevo-chat{
    background:var(--bg-card); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:8px; cursor:pointer; font-size:14px; text-align:left;
    display:flex; align-items:center; gap:8px;
  }
  #nuevo-chat:hover{background:#333338}
  #sidebar .footer{margin-top:auto; font-size:12px; color:var(--text-dim); padding:6px}
  /* ---------- Main ---------- */
  #main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%}
  #topbar{
    display:none; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--border); background:var(--bg);
  }
  #topbar button{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer}
  #chat{flex:1; overflow-y:auto; padding:24px 14px 10px}
  .msg{max-width:760px; margin:0 auto 22px; display:flex; gap:12px}
  .msg .avatar{
    width:28px;height:28px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:14px; font-weight:600;
  }
  .msg.user .avatar{background:var(--user-bubble); color:#aebcff}
  .msg.bot .avatar{background:var(--accent); color:#0c1030}
  .msg .content{line-height:1.6; font-size:15px; overflow-wrap:break-word; min-width:0}
  .msg .content p{margin:0 0 10px}
  .msg .content p:last-child{margin-bottom:0}
  .msg .content pre{
    background:#151517; border:1px solid var(--border); border-radius:8px;
    padding:12px 14px; overflow-x:auto; margin:10px 0; position:relative;
  }
  .msg .content code{font-family:"SF Mono",Consolas,monospace; font-size:13px}
  .msg .content :not(pre)>code{background:#151517; padding:2px 5px; border-radius:4px}
  .copy-btn{
    position:absolute; top:6px; right:6px; background:var(--bg-card); border:1px solid var(--border);
    color:var(--text-dim); font-size:11px; padding:3px 8px; border-radius:6px; cursor:pointer;
  }
  .copy-btn:hover{color:var(--text)}
  .typing{display:flex; gap:4px; padding:6px 0}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:blink 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  /* ---------- Input ---------- */
  #input-bar{
    padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--border); background:var(--bg);
  }
  #input-wrap{
    max-width:760px; margin:0 auto; display:flex; align-items:flex-end; gap:8px;
    background:var(--bg-input); border:1px solid var(--border); border-radius:14px; padding:8px 8px 8px 14px;
  }
  #entrada{
    flex:1; background:none; border:none; outline:none; color:var(--text); font-size:15px;
    resize:none; max-height:160px; font-family:inherit; line-height:1.4; padding:6px 0;
  }
  #enviar{
    background:var(--accent); border:none; color:#0c1030; width:34px; height:34px; border-radius:9px;
    cursor:pointer; flex-shrink:0; font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  #enviar:disabled{opacity:.4; cursor:default}
  #hint{max-width:760px; margin:8px auto 0; font-size:11px; color:var(--text-dim); text-align:center}
  @media (max-width:760px){
    #sidebar{position:fixed; z-index:20; height:100%; margin-left:-260px}
    #sidebar.open{margin-left:0}
    #topbar{display:flex}
    #backdrop{position:fixed; inset:0; z-index:15; background:rgba(0,0,0,.5); display:none}
    #backdrop.open{display:block}
    #cerrar-sidebar{display:block}
  }
  #cerrar-sidebar{display:none; position:absolute; top:10px; right:10px; background:transparent; border:0; color:var(--text); font-size:22px; line-height:1; padding:6px 10px; cursor:pointer}
  /* ---------- Lista de chats y usuario ---------- */
  #lista-chats{flex:1; overflow-y:auto; margin:12px 0 8px; display:flex; flex-direction:column; gap:2px}
  .chat-item{display:flex; align-items:center; border-radius:8px; cursor:pointer}
  .chat-item:hover,.chat-item.activo{background:var(--bg-card)}
  .chat-item span{flex:1; padding:9px 10px; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chat-item button{background:none; border:0; color:var(--text-dim); font-size:15px; padding:8px 10px; cursor:pointer}
  .chat-item button:hover{color:#ff7b7b}
  #usuario-box{border-top:1px solid var(--border); padding:10px 6px 4px; font-size:13px; display:flex; align-items:center; gap:8px}
  #usuario-box strong{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500}
  #usuario-box button{background:var(--bg-card); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px}
  /* ---------- Login / registro ---------- */
  #auth{position:fixed; inset:0; z-index:50; background:var(--bg); display:none; align-items:center; justify-content:center; padding:20px}
  #auth.open{display:flex}
  #auth-card{width:100%; max-width:380px; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:24px}
  #auth-card h2{margin:0 0 4px; font-size:20px; display:flex; align-items:center; gap:8px}
  #auth-card h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  #auth-card p.sub{margin:0 0 18px; color:var(--text-dim); font-size:13px}
  #auth-tabs{display:flex; gap:6px; margin-bottom:16px}
  #auth-tabs button{flex:1; padding:9px; background:transparent; border:1px solid var(--border); color:var(--text-dim); border-radius:8px; cursor:pointer; font-size:14px}
  #auth-tabs button.activo{background:var(--accent); border-color:var(--accent); color:#0c1030; font-weight:600}
  #auth-card input{width:100%; margin-bottom:10px; padding:11px 12px; background:var(--bg-input); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:15px}
  #auth-card input:focus{outline:none; border-color:var(--accent)}
  #auth-error{color:#ff8a8a; font-size:13px; min-height:18px; margin-bottom:8px}
  #auth-enviar{width:100%; padding:11px; background:var(--accent); border:0; border-radius:8px; color:#0c1030; font-weight:600; font-size:15px; cursor:pointer}
  #auth-enviar:disabled{opacity:.5}
</style>
</head>
<body>

<div id="backdrop" onclick="toggleSidebar(false)"></div>
<div id="sidebar">
  <button id="cerrar-sidebar" aria-label="Cerrar menú" onclick="toggleSidebar(false)">✕</button>
  <h1><span class="dot"></span> CodeMentor</h1>
  <button id="nuevo-chat" onclick="nuevoChat()">＋ Nueva conversación</button>
  <div id="lista-chats"></div>
  <div id="usuario-box" style="display:none"><strong id="usuario-nombre"></strong><button onclick="cerrarSesion()">Salir</button></div>
  <div class="footer">Asistente de programación<br>potenciado por IA</div>
</div>

<div id="auth">
  <div id="auth-card">
    <h2><span class="dot"></span> CodeMentor</h2>
    <p class="sub">Ingresá o creá una cuenta para guardar tus conversaciones.</p>
    <div id="auth-tabs">
      <button id="tab-login" class="activo" onclick="cambiarModoAuth('login')">Ingresar</button>
      <button id="tab-registro" onclick="cambiarModoAuth('registro')">Crear cuenta</button>
    </div>
    <input id="auth-nombre" type="text" placeholder="Nombre" autocomplete="name" style="display:none">
    <input id="auth-email" type="email" placeholder="Email" autocomplete="email">
    <input id="auth-pass" type="password" placeholder="Contraseña (mín. 8 caracteres)" autocomplete="current-password">
    <div id="auth-error"></div>
    <button id="auth-enviar" onclick="enviarAuth()">Ingresar</button>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <button onclick="toggleSidebar()">☰</button>
    <strong>CodeMentor</strong>
  </div>
  <div id="chat"></div>
  <div id="input-bar">
    <div id="input-wrap">
      <textarea id="entrada" rows="1" placeholder="Preguntale algo a CodeMentor…"></textarea>
      <button id="enviar" onclick="enviar()">➤</button>
    </div>
    <div id="hint">CodeMentor puede cometer errores. Verificá el código antes de usarlo en producción.</div>
  </div>
</div>

<script>
hljs.configure({ignoreUnescapedHTML:true});
marked.setOptions({ breaks:true });

let historial = []; // [{rol:'user'|'bot', texto:''}]
const chatEl = document.getElementById('chat');
const entradaEl = document.getElementById('entrada');

// Contador de visitas (silencioso, no bloquea la carga)
fetch('./contador.php').catch(()=>{});

function toggleSidebar(abrir){
  const sb = document.getElementById('sidebar');
  const abierto = abrir === undefined ? !sb.classList.contains('open') : abrir;
  sb.classList.toggle('open', abierto);
  document.getElementById('backdrop').classList.toggle('open', abierto);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleSidebar(false); });

// ---------- API helper ----------
async function api(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
  if(r.status === 401){ mostrarAuth(); throw new Error('no autenticado'); }
  return r.json();
}

// ---------- Modo local (Termux): sin cuenta, historial en el navegador ----------
const MODO_LOCAL = ['127.0.0.1','localhost','[::1]'].includes(location.hostname);
const LS_CHATS = 'codementor_chats_local';
function localLeer(){
  try{ return JSON.parse(localStorage.getItem(LS_CHATS)) || []; }catch(e){ return []; }
}
function localEscribir(chats){
  try{ localStorage.setItem(LS_CHATS, JSON.stringify(chats)); }catch(e){}
}

// ---------- Login / registro ----------
let modoAuth = 'login';
let usuario = null;
let chatId = null;

function mostrarAuth(){
  usuario = null;
  document.getElementById('auth').classList.add('open');
}
function cambiarModoAuth(m){
  modoAuth = m;
  document.getElementById('tab-login').classList.toggle('activo', m==='login');
  document.getElementById('tab-registro').classList.toggle('activo', m==='registro');
  document.getElementById('auth-nombre').style.display = m==='registro' ? 'block' : 'none';
  document.getElementById('auth-pass').autocomplete = m==='registro' ? 'new-password' : 'current-password';
  document.getElementById('auth-enviar').textContent = m==='registro' ? 'Crear cuenta' : 'Ingresar';
  document.getElementById('auth-error').textContent = '';
}
async function enviarAuth(){
  const err = document.getElementById('auth-error');
  const btn = document.getElementById('auth-enviar');
  err.textContent = '';
  const body = {
    accion: modoAuth,
    nombre: document.getElementById('auth-nombre').value.trim(),
    email: document.getElementById('auth-email').value.trim(),
    password: document.getElementById('auth-pass').value
  };
  btn.disabled = true;
  try{
    const r = await fetch('./usuario_api.php', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const data = await r.json();
    if(data.status === 'ok'){
      document.getElementById('auth-pass').value = '';
      entrarComoUsuario(data.usuario);
    } else {
      err.textContent = data.message || 'No se pudo completar la operación.';
    }
  }catch(e){
    err.textContent = 'No se pudo conectar con el servidor.';
  }
  btn.disabled = false;
}
document.getElementById('auth-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') enviarAuth(); });

function entrarComoUsuario(u){
  usuario = u;
  document.getElementById('auth').classList.remove('open');
  document.getElementById('usuario-nombre').textContent = u.nombre;
  document.getElementById('usuario-box').style.display = 'flex';
  nuevoChat();
  cargarChats();
}
async function cerrarSesion(){
  try{ await fetch('./usuario_api.php', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({accion:'logout'})}); }catch(e){}
  usuario = null; chatId = null; historial = [];
  chatEl.innerHTML = '';
  document.getElementById('lista-chats').innerHTML = '';
  document.getElementById('usuario-box').style.display = 'none';
  toggleSidebar(false);
  cambiarModoAuth('login');
  mostrarAuth();
}

// ---------- Lista de conversaciones ----------
async function cargarChats(){
  try{
    const data = MODO_LOCAL
      ? {chats: localLeer().sort((a,b)=>b.actualizado-a.actualizado).map(c=>({id:c.id, titulo:c.titulo}))}
      : await api('./conversaciones_api.php', {accion:'listar'});
    const cont = document.getElementById('lista-chats');
    cont.innerHTML = '';
    (data.chats || []).forEach(c=>{
      const it = document.createElement('div');
      it.className = 'chat-item' + (String(c.id) === String(chatId) ? ' activo' : '');
      const t = document.createElement('span');
      t.textContent = c.titulo;
      t.onclick = ()=>abrirChat(c.id);
      const x = document.createElement('button');
      x.textContent = '✕'; x.title = 'Eliminar';
      x.onclick = async (ev)=>{
        ev.stopPropagation();
        if(!confirm('¿Eliminar esta conversación?')) return;
        if(MODO_LOCAL) localEscribir(localLeer().filter(x=>x.id !== c.id));
        else await api('./conversaciones_api.php', {accion:'eliminar', chat_id:c.id});
        if(String(c.id) === String(chatId)) nuevoChat();
        cargarChats();
      };
      it.appendChild(t); it.appendChild(x);
      cont.appendChild(it);
    });
  }catch(e){}
}
async function abrirChat(id){
  try{
    let data;
    if(MODO_LOCAL){
      const c = localLeer().find(x=>x.id === id);
      if(!c) return;
      data = {status:'ok', mensajes:c.mensajes};
    } else {
      data = await api('./conversaciones_api.php', {accion:'mensajes', chat_id:id});
    }
    if(data.status !== 'ok') return;
    chatId = id; historial = []; chatEl.innerHTML = '';
    data.mensajes.forEach(m=>{
      agregarMensaje(m.rol, m.rol === 'user' ? escaparHTML(m.contenido) : m.contenido);
      historial.push({rol:m.rol, texto:m.contenido});
    });
    toggleSidebar(false);
    cargarChats();
  }catch(e){}
}
async function guardarMensaje(rol, contenido){
  if(MODO_LOCAL){
    const chats = localLeer();
    let c = chats.find(x=>x.id === chatId);
    if(!c){
      c = {id: Date.now(), titulo: contenido.replace(/\s+/g,' ').slice(0,60) || 'Nueva conversación', mensajes: [], actualizado: 0};
      chats.push(c);
      chatId = c.id;
    }
    c.mensajes.push({rol, contenido});
    c.actualizado = Date.now();
    localEscribir(chats);
    return;
  }
  try{
    const data = await api('./conversaciones_api.php', {accion:'guardar_mensaje', chat_id: chatId || 0, rol, contenido});
    if(data.status === 'ok') chatId = data.chat_id;
  }catch(e){}
}

function nuevoChat(){
  historial = [];
  chatId = null;
  chatEl.innerHTML = '';
  mostrarBienvenida();
  toggleSidebar(false);
  document.querySelectorAll('.chat-item.activo').forEach(el=>el.classList.remove('activo'));
}

function mostrarBienvenida(){
  agregarMensaje('bot', 'Hola, soy **CodeMentor**. Preguntame lo que necesites sobre programación, desarrollo web o apps.');
}

function autoResize(){
  entradaEl.style.height = 'auto';
  entradaEl.style.height = Math.min(entradaEl.scrollHeight, 160) + 'px';
}
entradaEl.addEventListener('input', autoResize);
entradaEl.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); }
});

function escaparHTML(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function renderContenido(texto){
  const html = marked.parse(texto);
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('pre code').forEach(block=>{
    hljs.highlightElement(block);
    const pre = block.parentElement;
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copiar';
    btn.onclick = ()=>{
      navigator.clipboard.writeText(block.textContent);
      btn.textContent = '¡Copiado!';
      setTimeout(()=>btn.textContent='Copiar', 1500);
    };
    pre.appendChild(btn);
  });
  return div;
}

function agregarMensaje(rol, texto){
  const msg = document.createElement('div');
  msg.className = 'msg ' + (rol === 'user' ? 'user' : 'bot');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = rol === 'user' ? 'Tú' : 'CM';
  const content = document.createElement('div');
  content.className = 'content';
  content.appendChild(renderContenido(texto));
  msg.appendChild(avatar);
  msg.appendChild(content);
  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
  return content;
}

// ---------- Efecto "escribiendo en tiempo real" ----------
let saltarEscritura = false;
async function escribirRespuesta(texto, nota){
  const content = agregarMensaje('bot', '');
  const partes = texto.split(/(\s+)/);               // palabras + espacios
  const palabras = partes.filter(x=>x.trim()).length;
  const delay = Math.max(15, Math.min(45, 12000 / Math.max(palabras, 1)));  // máx ~12 s en total
  saltarEscritura = false;
  let acumulado = '';
  for(let i = 0; i < partes.length; i++){
    if(saltarEscritura) break;
    acumulado += partes[i];
    if(partes[i].trim()){                              // render solo al llegar una palabra
      content.innerHTML = marked.parse(acumulado);
      const cerca = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 120;
      if(cerca) chatEl.scrollTop = chatEl.scrollHeight;
      await new Promise(res=>setTimeout(res, delay));
    }
  }
  content.replaceChildren(renderContenido(texto));     // versión final con resaltado y botón Copiar
  if(nota){
    const n = document.createElement('div');
    n.textContent = nota;
    n.style.cssText = 'margin-top:10px; font-size:12px; color:var(--text-dim)';
    content.appendChild(n);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}
chatEl.addEventListener('click', ()=>{ saltarEscritura = true; });  // tocar el chat completa la respuesta al instante

function agregarTyping(){
  const msg = document.createElement('div');
  msg.className = 'msg bot';
  msg.id = 'typing-msg';
  msg.innerHTML = '<div class="avatar">CM</div><div class="content"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function quitarTyping(){
  const t = document.getElementById('typing-msg');
  if(t) t.remove();
}

// Diagnóstico: abrí la página con ?debug=1 para ver bajo cada respuesta por qué hubo (o no) match.
const DEBUG = new URLSearchParams(location.search).has('debug');
let diagnostico = '';
async function buscarContexto(pregunta){
  diagnostico = '';
  try{
    const r = await fetch('./buscar.php', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pregunta, maximo: 2 })
    });
    const data = await r.json();
    if(data.status !== 'ok'){ diagnostico = 'buscar.php respondió error: ' + (data.message || JSON.stringify(data).slice(0,120)); return {contexto:'', mejor:null}; }
    if(!data.resultados || !data.resultados.length){ diagnostico = 'buscar.php no encontró ningún candidato'; return {contexto:'', mejor:null}; }
    const contexto = data.resultados.map(item=>{
      const it = item.item || item;
      return `Concepto: ${it.concepto || ''}\nDescripción: ${(it.descripcion || '').slice(0, 500)}\nEjemplo: ${(it.ejemplo || '').slice(0, 300)}`;
    }).join('\n\n');
    return {contexto, mejor: data.resultados[0]};   // buscar.php ya los devuelve ordenados por _score
  }catch(e){
    diagnostico = 'buscar.php no devolvió JSON válido (HTTP/PHP falló): ' + e.message;
    return {contexto:'', mejor:null}; // sin contexto, el modelo responde igual con conocimiento general
  }
}

// Umbral desde el panel (config_publica.php): si el mejor match lo alcanza, se responde
// con la base de conocimiento y NO se llama al modelo.
let umbralEvitarIA = null;
async function obtenerUmbral(){
  if(umbralEvitarIA !== null) return umbralEvitarIA;
  try{
    const r = await fetch('./config_publica.php');
    const d = await r.json();
    if(d.status === 'ok') umbralEvitarIA = Number(d.umbral_evitar_ia);
  }catch(e){}
  return umbralEvitarIA !== null ? umbralEvitarIA : 0.60;
}

const LENGUAJES = {javascript:'javascript','node.js':'javascript',typescript:'typescript',php:'php',html:'html',css:'css',python:'python',sql:'sql',java:'java',bash:'bash',json:'json'};
function respuestaDesdeConocimiento(it){
  const lang = LENGUAJES[(it.categoria||'').trim().toLowerCase()] || '';
  const bloque = c => '```' + lang + '\n' + c.trim() + '\n```';
  const sint = (it.sintaxis||'').trim(), ejem = (it.ejemplo||'').trim();
  let md = (it.descripcion||'').trim();
  if(sint) md += '\n\n**Sintaxis**\n\n' + bloque(sint);
  if(ejem && ejem !== sint) md += '\n\n**Ejemplo**\n\n' + bloque(ejem);
  if((it.errores||'').trim()) md += '\n\n**Errores comunes**\n\n' + it.errores.trim();
  if((it.buenas_practicas||'').trim()) md += '\n\n**Buenas prácticas**\n\n' + it.buenas_practicas.trim();
  return md.trim();
}

async function enviar(){
  const texto = entradaEl.value.trim();
  if(!texto) return;
  entradaEl.value = '';
  autoResize();
  document.getElementById('enviar').disabled = true;

  agregarMensaje('user', escaparHTML(texto));
  historial.push({ rol:'user', texto });
  agregarTyping();
  await guardarMensaje('user', texto);

  const {contexto, mejor} = await buscarContexto(texto);
  const umbral = await obtenerUmbral();
  if(mejor && !diagnostico) diagnostico = `mejor candidato: "${mejor.concepto || mejor.pregunta}" · score ${mejor._score} · umbral ${umbral}` + ((mejor.descripcion||'').trim() ? '' : ' · sin descripción');

  if(mejor && (mejor._score || 0) >= umbral && (mejor.descripcion || '').trim()){
    // Match suficiente: se responde desde la base de conocimiento, sin llamar al modelo.
    quitarTyping();
    const resp = respuestaDesdeConocimiento(mejor);
    historial.push({ rol:'bot', texto: resp });
    const guardado = guardarMensaje('bot', resp);
    await escribirRespuesta(resp, '📚 Respuesta Generada por CodeMentor');
    await guardado;
    cargarChats();
    document.getElementById('enviar').disabled = false;
    return;
  }

  try{
    const r = await fetch('./gemini.php', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pregunta: texto, contexto, historial: historial.slice(-10) })
    });
    const data = await r.json();
    quitarTyping();
    if(data.status === 'ok'){
      historial.push({ rol:'bot', texto: data.respuesta });
      const guardado = guardarMensaje('bot', data.respuesta);
      await escribirRespuesta(data.respuesta, DEBUG ? '🔎 Sin match → modelo (' + (data.motor || '?') + '). ' + diagnostico : '');
      await guardado;
      cargarChats();
    } else {
      agregarMensaje('bot', '⚠️ ' + (data.message || 'Ocurrió un error, intentá de nuevo.'));
    }
  }catch(e){
    quitarTyping();
    agregarMensaje('bot', '⚠️ No se pudo conectar con el servidor. Revisá tu conexión e intentá de nuevo.');
  }
  document.getElementById('enviar').disabled = false;
}
